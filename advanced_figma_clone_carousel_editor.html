<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Figma Clone - Carousel Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --panel-bg: #2c2c2c;
            --border-color: #444;
            --accent-color: #0d99ff;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --guide-color: #ff0055;
            --handle-size: 8px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        input, select, textarea {
            background: rgba(0,0,0,0.3);
            border: 1px solid transparent;
            color: white;
            outline: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            width: 100%;
            transition: border 0.2s;
            direction: ltr;
        }

        input:focus, select:focus {
            border: 1px solid var(--accent-color);
        }
        
        input[type="color"] {
            padding: 0;
            height: 24px;
            cursor: pointer;
        }

        .tool-btn {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tool-btn:hover { color: white; background: rgba(255,255,255,0.1); }
        .tool-btn.active { color: white; background: var(--accent-color); }

        .workspace-wrapper {
            flex: 1;
            background: #111;
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            position: relative;
            /* Scaling it down visually for standard screens while keeping logical 1080x1350 */
            transform: scale(0.5); 
            transform-origin: center center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .canvas-artboard {
            width: 1080px;
            height: 1350px;
            background: #ffffff;
            position: relative;
            overflow: hidden; /* Acts like a Figma Frame */
        }

        .element {
            position: absolute;
            transform-origin: center;
            cursor: default; /* Changes based on tool */
        }

        .element.text-element {
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Selection Overlay & Handles */
        #selectionOverlay {
            position: absolute;
            border: 1.5px solid var(--accent-color);
            pointer-events: none; /* Let clicks pass through to element */
            display: none;
            z-index: 999;
        }

        .resize-handle {
            position: absolute;
            width: var(--handle-size);
            height: var(--handle-size);
            background: white;
            border: 1px solid var(--accent-color);
            pointer-events: auto;
            z-index: 1000;
        }

        .resize-handle:hover { background: var(--accent-color); }

        /* Handle Positions */
        .h-nw { top: -4px; left: -4px; cursor: nwse-resize; }
        .h-n  { top: -4px; left: calc(50% - 4px); cursor: ns-resize; }
        .h-ne { top: -4px; right: -4px; cursor: nesw-resize; }
        .h-e  { top: calc(50% - 4px); right: -4px; cursor: ew-resize; }
        .h-se { bottom: -4px; right: -4px; cursor: nwse-resize; }
        .h-s  { bottom: -4px; left: calc(50% - 4px); cursor: ns-resize; }
        .h-sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
        .h-w  { top: calc(50% - 4px); left: -4px; cursor: ew-resize; }

        /* Smart Guides */
        .smart-guide {
            position: absolute;
            background: var(--guide-color);
            z-index: 998;
            pointer-events: none;
            display: none;
        }
        .guide-v { width: 1px; top: 0; bottom: 0; }
        .guide-h { height: 1px; left: 0; right: 0; }

        #dragMarquee {
            position: absolute;
            border: 1px solid var(--accent-color);
            background: rgba(13, 153, 255, 0.1);
            pointer-events: none;
            display: none;
            z-index: 1000;
        }

        .spacing-badge {
            position: absolute;
            background: var(--guide-color);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
        }

        .layer-item.active { background: rgba(13, 153, 255, 0.2); color: var(--accent-color); border-right: 3px solid var(--accent-color); }
        .slide-tab { min-width: 46px; padding: 6px 10px; border: 1px solid #555; border-radius: 6px; color: #bbb; font-size: 11px; }
        .slide-tab.active { background: #0d99ff; border-color: #0d99ff; color: white; }
    </style>
</head>
<body class="flex flex-col">

    <!-- Topbar -->
    <header class="h-12 bg-[#2c2c2c] border-b border-[#444] flex items-center justify-between px-4 shrink-0">
        <div class="flex gap-2" id="toolbar">
            <div class="tool-btn active" data-tool="V" title="Move (V)">
                <svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor"><path d="M0 0L12 11.5L6.5 12.5L9.5 17L7.5 18L4.5 13.5L0 17V0Z"/></svg>
            </div>
            <div class="tool-btn" data-tool="R" title="Rectangle (R)">
                <div class="w-4 h-4 border-2 border-current"></div>
            </div>
            <div class="tool-btn" data-tool="O" title="Ellipse (O)">
                <div class="w-4 h-4 border-2 border-current rounded-full"></div>
            </div>
            <div class="tool-btn" data-tool="T" title="Text (T)">
                <span class="font-serif font-bold text-sm">T</span>
            </div>
            <div class="tool-btn" data-tool="I" title="Image (I)">
                <span class="text-sm">▧</span>
            </div>
        </div>
        <div class="text-xs text-gray-400 font-semibold tracking-wider">
            CAROUSEL POSTER (1080 x 1350)
        </div>
        <div class="flex gap-2">
            <span class="text-[10px] text-gray-500 flex items-center">Scale: 50%</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Left Sidebar (Layers) -->
        <aside class="w-60 bg-[#2c2c2c] border-l border-[#444] flex flex-col shrink-0 z-10">
            <div class="px-4 py-3 text-xs font-bold text-gray-400 uppercase tracking-widest border-b border-[#444]">Layers</div>
            <div class="flex-1 overflow-y-auto py-2" id="layersPanel">
                <!-- Layers injected here -->
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace-wrapper" id="workspace">
            <div id="slideTabs" class="absolute top-3 left-1/2 z-20 flex max-w-[70%] -translate-x-1/2 gap-2 overflow-x-auto rounded-lg bg-[#2c2c2c] p-2 shadow-lg"></div>
            <div class="canvas-container">
                <div class="canvas-artboard" id="artboard">
                    <!-- Elements injected here -->

                    <!-- Selection Box Overlay -->
                    <div id="selectionOverlay">
                        <div class="resize-handle h-nw" data-handle="nw"></div>
                        <div class="resize-handle h-n" data-handle="n"></div>
                        <div class="resize-handle h-ne" data-handle="ne"></div>
                        <div class="resize-handle h-e" data-handle="e"></div>
                        <div class="resize-handle h-se" data-handle="se"></div>
                        <div class="resize-handle h-s" data-handle="s"></div>
                        <div class="resize-handle h-sw" data-handle="sw"></div>
                        <div class="resize-handle h-w" data-handle="w"></div>
                    </div>

                    <!-- Drag Marquee Selection Box -->
                    <div id="dragMarquee"></div>

                    <!-- Smart Guides -->
                    <div id="guideX" class="smart-guide guide-v"></div>
                    <div id="guideY" class="smart-guide guide-h"></div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar (Properties) -->
        <aside class="w-72 bg-[#2c2c2c] border-r border-[#444] flex flex-col shrink-0 z-10 overflow-y-auto">
            <!-- Alignment/Transform -->
            <div class="p-4 border-b border-[#444]">
                <div class="text-[11px] font-bold text-gray-400 uppercase mb-3">Transform</div>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500 w-3">X</span><input type="text" id="propX" data-prop="x"></div>
                    <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500 w-3">Y</span><input type="text" id="propY" data-prop="y"></div>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500 w-3">W</span><input type="text" id="propW" data-prop="w" placeholder="e.g. 50%"></div>
                    <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500 w-3">H</span><input type="text" id="propH" data-prop="h" placeholder="e.g. 100px"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex items-center gap-2" title="Rotation"><span class="text-[10px] text-gray-500 w-3">°</span><input type="number" id="propRot" data-prop="rotation" value="0"></div>
                    <div class="flex items-center gap-2" title="Corner Radius"><span class="text-[10px] text-gray-500 w-3">R</span><input type="number" id="propRad" data-prop="radius" value="0"></div>
                </div>
            </div>

            <!-- Text Properties (Hidden by default) -->
            <div class="p-4 border-b border-[#444]" id="textPropsPanel" style="display: none;">
                <div class="text-[11px] font-bold text-gray-400 uppercase mb-3">Text</div>
                <textarea id="propTextContent" data-prop="content" class="mb-2 h-20 resize-none"></textarea>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500">Size</span><input type="number" id="propFontSize" data-prop="fontSize"></div>
                    <select id="propFontWeight" data-prop="fontWeight">
                        <option value="400">Regular</option>
                        <option value="500">Medium</option>
                        <option value="700">Bold</option>
                        <option value="900">Black</option>
                    </select>
                </div>
                <select id="propTextAlign" data-prop="textAlign">
                    <option value="right">Right / RTL</option>
                    <option value="center">Center</option>
                    <option value="left">Left / LTR</option>
                </select>
            </div>

            <!-- Fill -->
            <div class="p-4 border-b border-[#444]">
                <div class="text-[11px] font-bold text-gray-400 uppercase mb-3">Fill</div>
                <div class="flex items-center gap-2 mb-2">
                    <input type="color" id="propFillColor" data-prop="fillColor" class="w-8">
                    <input type="text" id="propFillColorHex" class="flex-1" readonly>
                    <input type="number" id="propFillOpacity" data-prop="fillOpacity" title="Opacity %" min="0" max="100" class="w-16">
                    <span class="text-xs text-gray-500">%</span>
                </div>
            </div>

            <!-- Stroke -->
            <div class="p-4 border-b border-[#444]">
                <div class="text-[11px] font-bold text-gray-400 uppercase mb-3">Stroke</div>
                <div class="flex items-center gap-2 mb-2">
                    <input type="color" id="propStrokeColor" data-prop="strokeColor" class="w-8">
                    <input type="number" id="propStrokeWidth" data-prop="strokeWidth" title="Width" min="0" class="w-16">
                    <select id="propStrokeStyle" data-prop="strokeStyle" class="flex-1">
                        <option value="solid">Solid</option>
                        <option value="dashed">Dashed</option>
                        <option value="dotted">Dotted</option>
                    </select>
                </div>
            </div>

            <!-- Effects (Shadows) -->
            <div class="p-4">
                <div class="text-[11px] font-bold text-gray-400 uppercase mb-3">Effects</div>
                <select id="propShadowType" data-prop="shadowType" class="mb-3">
                    <option value="none">No Shadow</option>
                    <option value="drop-shadow">Drop Shadow</option>
                    <option value="inner-shadow">Inner Shadow</option>
                </select>
                
                <div id="shadowControls" style="display: none;">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500 w-3">X</span><input type="number" id="propShadowX" data-prop="shadowX"></div>
                        <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500 w-3">Y</span><input type="number" id="propShadowY" data-prop="shadowY"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500 w-3">B</span><input type="number" id="propShadowBlur" data-prop="shadowBlur" title="Blur"></div>
                        <div class="flex items-center gap-2"><span class="text-[10px] text-gray-500 w-3">S</span><input type="number" id="propShadowSpread" data-prop="shadowSpread" title="Spread"></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="color" id="propShadowColor" data-prop="shadowColor" class="w-8">
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // --- State ---
        const ARTBOARD_W = 1080;
        const ARTBOARD_H = 1350;
        const SCALE = 0.5; // Visual scale in the workspace

        let state = {
            tool: 'V', // V (move), R (rect), O (circle), T (text)
            elements: [],
            selectedIds: [], // מערך לבחירה מרובה
            dragState: null // handles dragging & resizing
        };

        let historyStack = [];
        let historyIndex = -1;
        let clipboard = []; // תמיכה בהעתקה מרובה
        let carouselSlides = [];
        let activeSlideIndex = 0;
        const elementsBySlide = {};
        let pendingImageInput = document.createElement('input');
        pendingImageInput.type = 'file';
        pendingImageInput.accept = 'image/*';
        pendingImageInput.style.display = 'none';
        document.body.appendChild(pendingImageInput);

        // DOM Elements
        const artboard = document.getElementById('artboard');
        const slideTabs = document.getElementById('slideTabs');
        const overlay = document.getElementById('selectionOverlay');
        const layersPanel = document.getElementById('layersPanel');
        const inputs = document.querySelectorAll('input[data-prop], select[data-prop], textarea[data-prop]');
        const toolBtns = document.querySelectorAll('.tool-btn');

        // --- Helpers ---
        function generateId() { return Math.random().toString(36).substr(2, 9); }
        
        function parseVal(val, relativeTo) {
            // Support pixels and percentages
            if (typeof val === 'string' && val.endsWith('%')) {
                return (parseFloat(val) / 100) * relativeTo;
            }
            return parseFloat(val) || 0;
        }

        function saveHistory() {
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            historyStack.push(JSON.parse(JSON.stringify(state.elements)));
            if (historyStack.length > 50) historyStack.shift();
            else historyIndex++;
            persistCurrentSlide();
        }

        function persistCurrentSlide() {
            if (!carouselSlides.length) {
                localStorage.setItem('karuai:advanced-editor-elements', JSON.stringify(state.elements));
                return;
            }
            elementsBySlide[carouselSlides[activeSlideIndex].id] = JSON.parse(JSON.stringify(state.elements));
            localStorage.setItem('karuai:advanced-editor-result', JSON.stringify({
                slides: carouselSlides.map(slide => ({
                    slideId: slide.id,
                    elements: elementsBySlide[slide.id] || createElementsFromSlide(slide, editorInput?.theme)
                }))
            }));
        }

        function renderSlideTabs() {
            if (!slideTabs) return;
            slideTabs.innerHTML = '';
            carouselSlides.forEach((slide, index) => {
                const button = document.createElement('button');
                button.className = `slide-tab ${index === activeSlideIndex ? 'active' : ''}`;
                button.textContent = `Slide ${index + 1}`;
                button.title = slide.title || `Slide ${index + 1}`;
                button.onclick = () => switchSlide(index);
                slideTabs.appendChild(button);
            });
        }

        function switchSlide(index) {
            if (index < 0 || index >= carouselSlides.length || index === activeSlideIndex) return;
            persistCurrentSlide();
            activeSlideIndex = index;
            state.elements = elementsBySlide[carouselSlides[index].id]
                || createElementsFromSlide(carouselSlides[index], editorInput?.theme);
            state.selectedIds = [];
            historyStack = [];
            historyIndex = -1;
            saveHistory();
            renderAll();
            renderSlideTabs();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                state.elements = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                state.selectedIds = [];
                renderAll();
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                state.elements = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                state.selectedIds = [];
                renderAll();
            }
        }

        function copySelection() {
            clipboard = state.elements.filter(e => state.selectedIds.includes(e.id)).map(e => JSON.parse(JSON.stringify(e)));
        }

        function pasteSelection() {
            if (clipboard.length > 0) {
                const newIds = [];
                clipboard.forEach(clipEl => {
                    const clone = JSON.parse(JSON.stringify(clipEl));
                    clone.id = generateId();
                    clone.x += 20; 
                    clone.y += 20;
                    state.elements.push(clone);
                    newIds.push(clone.id);
                    clipEl.x += 20; clipEl.y += 20; // update clipboard for next paste
                });
                state.selectedIds = newIds;
                saveHistory();
                renderAll();
            }
        }

        function cutSelection() {
            copySelection();
            deleteSelected();
        }

        function duplicateSelection() {
            if (state.selectedIds.length === 0) return;
            const newIds = [];
            state.selectedIds.forEach(id => {
                const el = state.elements.find(e => e.id === id);
                if (el) {
                    const clone = cloneElement(el);
                    newIds.push(clone.id);
                }
            });
            state.selectedIds = newIds;
            saveHistory();
            renderAll();
        }

        // --- Core Logic ---
        function createElement(type, x, y) {
            const el = {
                id: generateId(),
                type: type, // 'rect', 'ellipse', 'text'
                name: type === 'rect' ? 'Rectangle' : type === 'ellipse' ? 'Ellipse' : 'Text',
                x: x, y: y,
                w: type === 'text' ? 400 : 200,
                h: type === 'text' ? 'auto' : 200,
                rotation: 0,
                radius: type === 'ellipse' ? 10000 : 0, // huge radius for circle
                
                fillColor: type === 'text' ? '#000000' : '#d9d9d9',
                fillOpacity: 100,
                
                strokeColor: '#000000',
                strokeWidth: 0,
                strokeStyle: 'solid',
                
                shadowType: 'none',
                shadowX: 0, shadowY: 4, shadowBlur: 4, shadowSpread: 0, shadowColor: '#000000',
                
                // Text specific
                content: type === 'text' ? 'Double click to edit or use panel' : '',
                fontSize: 64,
                fontWeight: '700',
                textAlign: 'right',
                src: ''
            };
            state.elements.push(el);
            return el;
        }

        function cloneElement(el) {
            const clone = JSON.parse(JSON.stringify(el));
            clone.id = generateId();
            clone.x += 20;
            clone.y += 20;
            state.elements.push(clone);
            return clone;
        }

        function deleteSelected() {
            if (state.selectedIds.length === 0) return;
            state.elements = state.elements.filter(e => !state.selectedIds.includes(e.id));
            state.selectedIds = [];
            saveHistory();
            renderAll();
        }

        // --- Rendering ---
        function renderAll() {
            renderElements();
            renderLayers();
            updateSelectionOverlay();
            updatePropertiesPanel();
        }

        function getCSSShadow(el) {
            if (el.shadowType === 'none') return 'none';
            const inset = el.shadowType === 'inner-shadow' ? 'inset ' : '';
            // Convert hex color to rgba with 25% opacity default for aesthetic if solid, but we use actual color
            return `${inset}${el.shadowX}px ${el.shadowY}px ${el.shadowBlur}px ${el.shadowSpread}px ${el.shadowColor}80`;
        }

        function getCSSBorder(el) {
            if (el.strokeWidth <= 0) return 'none';
            return `${el.strokeWidth}px ${el.strokeStyle} ${el.strokeColor}`;
        }

        function renderElements() {
            // Remove old dom elements except overlay and guides
            Array.from(artboard.children).forEach(child => {
                if (child.id !== 'selectionOverlay' && !child.classList.contains('smart-guide')) {
                    child.remove();
                }
            });

            state.elements.forEach(el => {
                const div = document.createElement('div');
                div.className = `element ${el.type === 'text' ? 'text-element' : ''}`;
                div.dataset.id = el.id;
                
                div.style.left = `${el.x}px`;
                div.style.top = `${el.y}px`;
                div.style.width = el.w === 'auto' ? 'auto' : `${el.w}px`;
                div.style.height = el.h === 'auto' ? 'auto' : `${el.h}px`;
                div.style.transform = `rotate(${el.rotation}deg)`;
                div.style.borderRadius = `${el.radius}px`;
                div.style.opacity = el.fillOpacity / 100;

                if (el.type === 'text') {
                    div.innerText = el.content;
                    div.style.color = el.fillColor;
                    div.style.fontSize = `${el.fontSize}px`;
                    div.style.fontWeight = el.fontWeight;
                    div.style.textAlign = el.textAlign;
                    // Text border/shadow usually applies to text-shadow or outline, but keeping simple box-model for now
                    div.style.textShadow = el.shadowType === 'drop-shadow' ? `${el.shadowX}px ${el.shadowY}px ${el.shadowBlur}px ${el.shadowColor}80` : 'none';
                } else if (el.type === 'image') {
                    div.style.backgroundImage = `url("${el.src}")`;
                    div.style.backgroundSize = 'cover';
                    div.style.backgroundPosition = 'center';
                    div.style.border = getCSSBorder(el);
                    div.style.boxShadow = getCSSShadow(el);
                } else {
                    div.style.backgroundColor = el.fillColor;
                    div.style.border = getCSSBorder(el);
                    div.style.boxShadow = getCSSShadow(el);
                }

                artboard.appendChild(div);
            });
        }

        function renderLayers() {
            layersPanel.innerHTML = '';
            // Render in reverse order (top layer first)
            [...state.elements].reverse().forEach(el => {
                const div = document.createElement('div');
                div.className = `px-4 py-2 text-[13px] flex items-center gap-2 cursor-pointer border-b border-white/5 layer-item ${state.selectedIds.includes(el.id) ? 'active' : ''}`;
                div.draggable = true;
                const icon = el.type === 'text' ? 'T' : el.type === 'ellipse' ? 'O' : '◻';
                div.innerHTML = `<span class="text-gray-500 font-bold w-4">${icon}</span> <span class="truncate">${el.name}</span>`;
                
                div.onclick = (e) => {
                    if (e.shiftKey) {
                        if (state.selectedIds.includes(el.id)) {
                            state.selectedIds = state.selectedIds.filter(id => id !== el.id);
                        } else {
                            state.selectedIds.push(el.id);
                        }
                    } else {
                        state.selectedIds = [el.id];
                    }
                    renderAll();
                };
                
                // --- Drag & Drop Layer Reordering ---
                div.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', el.id);
                    e.dataTransfer.effectAllowed = 'move';
                };
                div.ondragover = (e) => {
                    e.preventDefault();
                    div.style.borderTop = '2px solid var(--accent-color)'; // סימון ויזואלי של מיקום ההנחה
                };
                div.ondragleave = (e) => {
                    div.style.borderTop = '';
                };
                div.ondrop = (e) => {
                    e.preventDefault();
                    div.style.borderTop = '';
                    const draggedId = e.dataTransfer.getData('text/plain');
                    if (draggedId && draggedId !== el.id) {
                        reorderLayer(draggedId, el.id);
                    }
                };

                layersPanel.appendChild(div);
            });
        }

        function reorderLayer(dragId, dropId) {
            let uiArr = [...state.elements].reverse();
            const dragIdx = uiArr.findIndex(e => e.id === dragId);
            const dropIdx = uiArr.findIndex(e => e.id === dropId);
            
            if (dragIdx > -1 && dropIdx > -1) {
                const [item] = uiArr.splice(dragIdx, 1);
                uiArr.splice(dropIdx, 0, item);
                state.elements = uiArr.reverse();
                saveHistory();
                renderAll();
            }
        }

        function updateSelectionOverlay() {
            if (state.selectedIds.length === 0) {
                overlay.style.display = 'none';
                return;
            }

            if (state.selectedIds.length === 1) {
                const el = state.elements.find(e => e.id === state.selectedIds[0]);
                const domEl = document.querySelector(`.element[data-id="${el.id}"]`);
                if (domEl) {
                    overlay.style.display = 'block';
                    overlay.style.left = `${el.x}px`;
                    overlay.style.top = `${el.y}px`;
                    overlay.style.width = `${domEl.offsetWidth}px`;
                    overlay.style.height = `${domEl.offsetHeight}px`;
                    overlay.style.transform = `rotate(${el.rotation}deg)`;
                    
                    const handles = overlay.querySelectorAll('.resize-handle');
                    handles.forEach(h => h.style.display = el.type === 'text' ? 'none' : 'block');
                }
            } else {
                // בחירה מרובה - יצירת קופסה המקיפה את כולם
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                state.selectedIds.forEach(id => {
                    const el = state.elements.find(e => e.id === id);
                    if (el) {
                        minX = Math.min(minX, el.x);
                        minY = Math.min(minY, el.y);
                        maxX = Math.max(maxX, el.x + (el.w === 'auto' ? 100 : el.w)); // פיצוי קל לטקסט
                        maxY = Math.max(maxY, el.y + (el.h === 'auto' ? 40 : el.h));
                    }
                });
                
                overlay.style.display = 'block';
                overlay.style.left = `${minX}px`;
                overlay.style.top = `${minY}px`;
                overlay.style.width = `${maxX - minX}px`;
                overlay.style.height = `${maxY - minY}px`;
                overlay.style.transform = `none`; // הסרת זווית מקופסה קבוצתית
                
                const handles = overlay.querySelectorAll('.resize-handle');
                handles.forEach(h => h.style.display = 'none'); // ביטול ידיות שינוי גודל בבחירה מרובה
            }
        }

        function updatePropertiesPanel() {
            if (state.selectedIds.length === 0) {
                inputs.forEach(inp => { inp.value = ''; inp.disabled = true; });
                document.getElementById('textPropsPanel').style.display = 'none';
                document.getElementById('shadowControls').style.display = 'none';
                return;
            }

            // מציג מאפיינים לפי האלמנט הראשון שנבחר בקבוצה
            const el = state.elements.find(e => e.id === state.selectedIds[0]);
            
            inputs.forEach(inp => inp.disabled = false);

            // Populate mapping
            inputs.forEach(inp => {
                const prop = inp.dataset.prop;
                if (el[prop] !== undefined) {
                    inp.value = el[prop];
                }
            });

            document.getElementById('propFillColorHex').value = el.fillColor.toUpperCase();
            
            // Panels visibility
            document.getElementById('textPropsPanel').style.display = el.type === 'text' ? 'block' : 'none';
            document.getElementById('shadowControls').style.display = el.shadowType !== 'none' ? 'block' : 'none';
            
            // Disable W/H for text
            document.getElementById('propW').disabled = el.type === 'text';
            document.getElementById('propH').disabled = el.type === 'text';
        }

        // --- Interaction Logic (Drag & Resize) ---
        
        // Tool selection
        toolBtns.forEach(btn => {
            btn.onclick = () => setTool(btn.dataset.tool);
        });

        function setTool(tool) {
            state.tool = tool;
            toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
            artboard.style.cursor = tool === 'V' ? 'default' : 'crosshair';
        }

        // Global mouse handlers on workspace
        artboard.addEventListener('mousedown', (e) => {
            const rect = artboard.getBoundingClientRect();
            // Calculate absolute x/y in the unscaled artboard space
            let mouseX = (e.clientX - rect.left) / SCALE;
            let mouseY = (e.clientY - rect.top) / SCALE;

            if (state.tool === 'I') {
                pendingImageInput.click();
                pendingImageInput.onchange = () => {
                    const file = pendingImageInput.files?.[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = () => {
                        const newEl = createElement('image', mouseX - 200, mouseY - 150);
                        newEl.src = reader.result;
                        newEl.w = 400;
                        newEl.h = 300;
                        newEl.name = file.name;
                        state.selectedIds = [newEl.id];
                        saveHistory();
                        renderAll();
                    };
                    reader.readAsDataURL(file);
                    pendingImageInput.value = '';
                };
                return;
            }
            if (state.tool !== 'V') {
                // Create new element
                let type = state.tool === 'R' ? 'rect' : state.tool === 'O' ? 'ellipse' : 'text';
                const newEl = createElement(type, mouseX, mouseY);
                state.selectedIds = [newEl.id];
                setTool('V');
                saveHistory();
                renderAll();
                return;
            }

            // Move / Select tool logic
            const target = e.target;

            // Handle Resize
            if (target.classList.contains('resize-handle') && state.selectedIds.length === 1) {
                const el = state.elements.find(e => e.id === state.selectedIds[0]);
                state.dragState = {
                    type: 'resize',
                    handle: target.dataset.handle,
                    startX: mouseX, startY: mouseY,
                    origX: el.x, origY: el.y, origW: el.w, origH: el.h,
                    element: el
                };
                return;
            }

            // Handle Element selection/drag
            const elementDiv = target.closest('.element');
            if (elementDiv) {
                const id = elementDiv.dataset.id;
                
                if (e.shiftKey) {
                    if (state.selectedIds.includes(id)) {
                        state.selectedIds = state.selectedIds.filter(i => i !== id);
                    } else {
                        state.selectedIds.push(id);
                    }
                } else {
                    if (!state.selectedIds.includes(id)) {
                        state.selectedIds = [id];
                    }
                }
                
                renderAll(); // update overlay
                
                if (state.selectedIds.length > 0) {
                    state.dragState = {
                        type: 'move',
                        startX: mouseX, startY: mouseY,
                        origElements: state.elements.filter(el => state.selectedIds.includes(el.id)).map(el => ({ ...el })),
                        hasCloned: false
                    };
                }
                return;
            }

            // Clicked empty space - Marquee Selection
            if (!e.shiftKey) {
                state.selectedIds = [];
            }
            state.dragState = {
                type: 'marquee',
                startX: mouseX, startY: mouseY
            };
            renderAll();
        });

        window.addEventListener('mousemove', (e) => {
            if (!state.dragState) return;
            
            const rect = artboard.getBoundingClientRect();
            let mouseX = (e.clientX - rect.left) / SCALE;
            let mouseY = (e.clientY - rect.top) / SCALE;
            
            let dx = mouseX - state.dragState.startX;
            let dy = mouseY - state.dragState.startY;

            if (state.dragState.type === 'move') {
                // Clone on Alt drag
                if (e.altKey && !state.dragState.hasCloned) {
                    const newIds = [];
                    state.dragState.origElements.forEach(origEl => {
                        const el = state.elements.find(ex => ex.id === origEl.id);
                        const clone = cloneElement(el);
                        newIds.push(clone.id);
                        origEl.id = clone.id; // עדכון מזהה המקור שימשיך להיגרר כשכפול
                    });
                    state.selectedIds = newIds;
                    state.dragState.hasCloned = true;
                    renderAll();
                    return; // skip this frame
                }

                // Orthogonal move on Shift
                if (e.shiftKey) {
                    if (Math.abs(dx) > Math.abs(dy)) dy = 0;
                    else dx = 0;
                }

                // הזזת כל האלמנטים הנבחרים
                state.dragState.origElements.forEach(orig => {
                    const el = state.elements.find(ex => ex.id === orig.id);
                    if (el) {
                        el.x = orig.x + dx;
                        el.y = orig.y + dy;
                        
                        // עדכון DOM מהיר לביצועים
                        const domEl = document.querySelector(`.element[data-id="${el.id}"]`);
                        if (domEl) {
                            domEl.style.left = `${el.x}px`;
                            domEl.style.top = `${el.y}px`;
                        }
                    }
                });

                // Smart guides check - פועל רק אם נבחר אלמנט בודד
                if (state.selectedIds.length === 1) {
                    checkSmartGuides(state.elements.find(e => e.id === state.selectedIds[0]));
                } else {
                    hideSmartGuides();
                }
                
                updateSelectionOverlay();

            } else if (state.dragState.type === 'marquee') {
                const minX = Math.min(mouseX, state.dragState.startX);
                const maxX = Math.max(mouseX, state.dragState.startX);
                const minY = Math.min(mouseY, state.dragState.startY);
                const maxY = Math.max(mouseY, state.dragState.startY);
                
                const marquee = document.getElementById('dragMarquee');
                marquee.style.display = 'block';
                marquee.style.left = `${minX}px`;
                marquee.style.top = `${minY}px`;
                marquee.style.width = `${maxX - minX}px`;
                marquee.style.height = `${maxY - minY}px`;

                // בדיקת התנגשויות (מי נכנס לקופסת הבחירה)
                const newSelection = state.elements.filter(el => {
                    const elW = el.w === 'auto' ? 100 : el.w;
                    const elH = el.h === 'auto' ? 40 : el.h;
                    return !(el.x > maxX || el.x + elW < minX || el.y > maxY || el.y + elH < minY);
                }).map(e => e.id);
                
                state.selectedIds = newSelection;
                
                // עדכון קופסת הבחירה בזמן אמת ללא רינדור מחדש כבד של הכל
                updateSelectionOverlay();
                renderLayers();
                
            } else if (state.dragState.type === 'resize') {
                const handle = state.dragState.handle;
                let newX = state.dragState.origX;
                let newY = state.dragState.origY;
                let newW = state.dragState.origW;
                let newH = state.dragState.origH;

                // Proportional scale
                if (e.shiftKey) {
                    const ratio = newW / newH;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        dy = dx / ratio * (Math.sign(dy) || 1) * (Math.sign(dx) || 1);
                    } else {
                        dx = dy * ratio * (Math.sign(dx) || 1) * (Math.sign(dy) || 1);
                    }
                }

                if (handle.includes('e')) newW += dx;
                if (handle.includes('s')) newH += dy;
                if (handle.includes('w')) {
                    newW -= dx;
                    newX += dx;
                }
                if (handle.includes('n')) {
                    newH -= dy;
                    newY += dy;
                }

                // Prevent negative size
                if (newW > 10) { el.w = newW; el.x = newX; }
                if (newH > 10) { el.h = newH; el.y = newY; }

                if (el.type === 'ellipse' && e.shiftKey) {
                    // Force circle
                    el.h = el.w;
                }

                // Force DOM update
                const domEl = document.querySelector(`.element[data-id="${el.id}"]`);
                if (domEl) {
                    domEl.style.left = `${el.x}px`;
                    domEl.style.top = `${el.y}px`;
                    domEl.style.width = `${el.w}px`;
                    domEl.style.height = `${el.h}px`;
                }
                updateSelectionOverlay();
            }
        });

        window.addEventListener('mouseup', () => {
            if (state.dragState) {
                if (state.dragState.type === 'move' || state.dragState.type === 'resize') {
                    saveHistory();
                }
                if (state.dragState.type === 'marquee') {
                    document.getElementById('dragMarquee').style.display = 'none';
                }
                state.dragState = null;
                hideSmartGuides();
                renderAll(); // Final sync
            }
        });

        // --- Smart Guides ---
        const guideX = document.getElementById('guideX');
        const guideY = document.getElementById('guideY');

        function checkSmartGuides(el) {
            let snappedX = false;
            let snappedY = false;
            const threshold = 8; // סף היצמדות גדול יותר לנוחות

            // מחיקת קווים קודמים
            document.querySelectorAll('.spacing-indicator').forEach(e => e.remove());
            guideX.style.display = 'none';
            guideY.style.display = 'none';

            // מרכז הקנבס
            const centerX = ARTBOARD_W / 2;
            const centerY = ARTBOARD_H / 2;
            const elCenterX = el.x + (el.w || 0) / 2;
            const elCenterY = el.y + (el.h || 0) / 2;
            
            const others = state.elements.filter(e => e.id !== el.id);

            // 1. הצמדה לקצוות ומרכזים של אלמנטים אחרים (Alignment)
            others.forEach(o => {
                const oCX = o.x + (o.w||0)/2;
                const oCY = o.y + (o.h||0)/2;
                const edgesX = [o.x, oCX, o.x + (o.w||0)]; // קצה שמאלי, מרכז, קצה ימני
                const edgesY = [o.y, oCY, o.y + (o.h||0)]; // עליון, אמצע, תחתון
                
                if (!snappedX) {
                    for (let ex of edgesX) {
                        if (Math.abs(el.x - ex) < threshold) { el.x = ex; snappedX = true; guideX.style.display = 'block'; guideX.style.left = `${ex}px`; break; }
                        if (Math.abs(elCenterX - ex) < threshold) { el.x = ex - (el.w||0)/2; snappedX = true; guideX.style.display = 'block'; guideX.style.left = `${ex}px`; break; }
                        if (Math.abs(el.x + (el.w||0) - ex) < threshold) { el.x = ex - (el.w||0); snappedX = true; guideX.style.display = 'block'; guideX.style.left = `${ex}px`; break; }
                    }
                }
                if (!snappedY) {
                    for (let ey of edgesY) {
                        if (Math.abs(el.y - ey) < threshold) { el.y = ey; snappedY = true; guideY.style.display = 'block'; guideY.style.top = `${ey}px`; break; }
                        if (Math.abs(elCenterY - ey) < threshold) { el.y = ey - (el.h||0)/2; snappedY = true; guideY.style.display = 'block'; guideY.style.top = `${ey}px`; break; }
                        if (Math.abs(el.y + (el.h||0) - ey) < threshold) { el.y = ey - (el.h||0); snappedY = true; guideY.style.display = 'block'; guideY.style.top = `${ey}px`; break; }
                    }
                }
            });

            // 2. הצמדה למרכז הקנבס (רק אם לא נצמד קודם לאלמנט)
            if (!snappedX && Math.abs(elCenterX - centerX) < threshold) {
                el.x = centerX - (el.w || 0) / 2;
                guideX.style.display = 'block';
                guideX.style.left = `${centerX}px`;
                snappedX = true;
            }

            if (!snappedY && Math.abs(elCenterY - centerY) < threshold) {
                el.y = centerY - (el.h || 0) / 2;
                guideY.style.display = 'block';
                guideY.style.top = `${centerY}px`;
                snappedY = true;
            }

            // --- מרווחים שווים (Equal Spacing) ---
            if (others.length >= 2) {
                // בדיקת מרווחים בציר אופקי (X)
                let leftEl = null; let minLeftDist = Infinity;
                let rightEl = null; let minRightDist = Infinity;

                others.forEach(o => {
                    if (el.y < o.y + (o.h||0) && el.y + (el.h||0) > o.y) {
                        const distL = el.x - (o.x + (o.w||0));
                        if (distL >= 0 && distL < minLeftDist) { minLeftDist = distL; leftEl = o; }
                        const distR = o.x - (el.x + (el.w||0));
                        if (distR >= 0 && distR < minRightDist) { minRightDist = distR; rightEl = o; }
                    }
                });

                // מצב 1: הצמדה בדיוק לאמצע בין שני אלמנטים
                if (leftEl && rightEl) {
                    const currentGapL = el.x - (leftEl.x + (leftEl.w||0));
                    const currentGapR = rightEl.x - (el.x + (el.w||0));
                    if (Math.abs(currentGapL - currentGapR) < threshold * 2) {
                        el.x = (rightEl.x + leftEl.x + (leftEl.w||0) - (el.w||0)) / 2;
                        snappedX = true;
                        const exactGap = Math.round(el.x - (leftEl.x + (leftEl.w||0)));
                        drawSpacingGuide(leftEl.x + (leftEl.w||0), el.x, el.y + (el.h||0)/2, exactGap, 'h');
                        drawSpacingGuide(el.x + (el.w||0), rightEl.x, el.y + (el.h||0)/2, exactGap, 'h');
                    }
                }

                // מצב 2: הוספת אלמנט מימין עם מרווח זהה (A...B...[Dragging C])
                if (leftEl && !snappedX) {
                    let leftLeftEl = null; let minLLDist = Infinity;
                    others.forEach(o => {
                        if (o.id !== leftEl.id && leftEl.y < o.y + (o.h||0) && leftEl.y + (leftEl.h||0) > o.y) {
                            const dist = leftEl.x - (o.x + (o.w||0));
                            if (dist >= 0 && dist < minLLDist) { minLLDist = dist; leftLeftEl = o; }
                        }
                    });
                    if (leftLeftEl) {
                        const targetGap = leftEl.x - (leftLeftEl.x + (leftLeftEl.w||0));
                        const currentGap = el.x - (leftEl.x + (leftEl.w||0));
                        if (Math.abs(currentGap - targetGap) < threshold) {
                            el.x = leftEl.x + (leftEl.w||0) + targetGap;
                            snappedX = true;
                            drawSpacingGuide(leftLeftEl.x + (leftLeftEl.w||0), leftEl.x, el.y + (el.h||0)/2, targetGap, 'h');
                            drawSpacingGuide(leftEl.x + (leftEl.w||0), el.x, el.y + (el.h||0)/2, targetGap, 'h');
                        }
                    }
                }

                // מצב 3: הוספת אלמנט משמאל עם מרווח זהה ([Dragging A]...B...C)
                if (rightEl && !snappedX) {
                    let rightRightEl = null; let minRRDist = Infinity;
                    others.forEach(o => {
                        if (o.id !== rightEl.id && rightEl.y < o.y + (o.h||0) && rightEl.y + (rightEl.h||0) > o.y) {
                            const dist = o.x - (rightEl.x + (rightEl.w||0));
                            if (dist >= 0 && dist < minRRDist) { minRRDist = dist; rightRightEl = o; }
                        }
                    });
                    if (rightRightEl) {
                        const targetGap = rightRightEl.x - (rightEl.x + (rightEl.w||0));
                        const currentGap = rightEl.x - (el.x + (el.w||0));
                        if (Math.abs(currentGap - targetGap) < threshold) {
                            el.x = rightEl.x - targetGap - (el.w||0);
                            snappedX = true;
                            drawSpacingGuide(el.x + (el.w||0), rightEl.x, el.y + (el.h||0)/2, targetGap, 'h');
                            drawSpacingGuide(rightEl.x + (rightEl.w||0), rightRightEl.x, el.y + (el.h||0)/2, targetGap, 'h');
                        }
                    }
                }

                // בדיקת מרווחים בציר אנכי (Y)
                let topEl = null; let minTopDist = Infinity;
                let bottomEl = null; let minBottomDist = Infinity;

                others.forEach(o => {
                    if (el.x < o.x + (o.w||0) && el.x + (el.w||0) > o.x) {
                        const distT = el.y - (o.y + (o.h||0));
                        if (distT >= 0 && distT < minTopDist) { minTopDist = distT; topEl = o; }
                        const distB = o.y - (el.y + (el.h||0));
                        if (distB >= 0 && distB < minBottomDist) { minBottomDist = distB; bottomEl = o; }
                    }
                });

                if (topEl && bottomEl && !snappedY) {
                    const currentGapT = el.y - (topEl.y + (topEl.h||0));
                    const currentGapB = bottomEl.y - (el.y + (el.h||0));
                    if (Math.abs(currentGapT - currentGapB) < threshold * 2) {
                        el.y = (bottomEl.y + topEl.y + (topEl.h||0) - (el.h||0)) / 2;
                        snappedY = true;
                        const exactGap = Math.round(el.y - (topEl.y + (topEl.h||0)));
                        drawSpacingGuide(topEl.y + (topEl.h||0), el.y, el.x + (el.w||0)/2, exactGap, 'v');
                        drawSpacingGuide(el.y + (el.h||0), bottomEl.y, el.x + (el.w||0)/2, exactGap, 'v');
                    }
                }

                if (topEl && !snappedY) {
                    let topTopEl = null; let minTTDist = Infinity;
                    others.forEach(o => {
                        if (o.id !== topEl.id && topEl.x < o.x + (o.w||0) && topEl.x + (topEl.w||0) > o.x) {
                            const dist = topEl.y - (o.y + (o.h||0));
                            if (dist >= 0 && dist < minTTDist) { minTTDist = dist; topTopEl = o; }
                        }
                    });
                    if (topTopEl) {
                        const targetGap = topEl.y - (topTopEl.y + (topTopEl.h||0));
                        const currentGap = el.y - (topEl.y + (topEl.h||0));
                        if (Math.abs(currentGap - targetGap) < threshold) {
                            el.y = topEl.y + (topEl.h||0) + targetGap;
                            snappedY = true;
                            drawSpacingGuide(topTopEl.y + (topTopEl.h||0), topEl.y, el.x + (el.w||0)/2, targetGap, 'v');
                            drawSpacingGuide(topEl.y + (topEl.h||0), el.y, el.x + (el.w||0)/2, targetGap, 'v');
                        }
                    }
                }

                if (bottomEl && !snappedY) {
                    let bottomBottomEl = null; let minBBDist = Infinity;
                    others.forEach(o => {
                        if (o.id !== bottomEl.id && bottomEl.x < o.x + (o.w||0) && bottomEl.x + (bottomEl.w||0) > o.x) {
                            const dist = o.y - (bottomEl.y + (bottomEl.h||0));
                            if (dist >= 0 && dist < minBBDist) { minBBDist = dist; bottomBottomEl = o; }
                        }
                    });
                    if (bottomBottomEl) {
                        const targetGap = bottomBottomEl.y - (bottomEl.y + (bottomEl.h||0));
                        const currentGap = bottomEl.y - (el.y + (el.h||0));
                        if (Math.abs(currentGap - targetGap) < threshold) {
                            el.y = bottomEl.y - targetGap - (el.h||0);
                            snappedY = true;
                            drawSpacingGuide(el.y + (el.h||0), bottomEl.y, el.x + (el.w||0)/2, targetGap, 'v');
                            drawSpacingGuide(bottomEl.y + (bottomEl.h||0), bottomBottomEl.y, el.x + (el.w||0)/2, targetGap, 'v');
                        }
                    }
                }
            }

            if (!snappedX) guideX.style.display = 'none';
            if (!snappedY) guideY.style.display = 'none';
        }

        function drawSpacingGuide(start, end, crossPos, value, dir) {
            const line = document.createElement('div');
            line.className = 'smart-guide spacing-indicator';
            line.style.display = 'block';
            line.style.backgroundColor = 'var(--guide-color)';

            const badge = document.createElement('div');
            badge.className = 'spacing-badge spacing-indicator';
            badge.innerText = Math.abs(value);
            badge.style.display = 'block';

            if (dir === 'h') {
                line.style.height = '1px';
                line.style.left = `${Math.min(start, end)}px`;
                line.style.width = `${Math.abs(end - start)}px`;
                line.style.top = `${crossPos}px`;

                badge.style.left = `${Math.min(start, end) + Math.abs(end - start)/2}px`;
                badge.style.top = `${crossPos}px`;
            } else {
                line.style.width = '1px';
                line.style.top = `${Math.min(start, end)}px`;
                line.style.height = `${Math.abs(end - start)}px`;
                line.style.left = `${crossPos}px`;

                badge.style.top = `${Math.min(start, end) + Math.abs(end - start)/2}px`;
                badge.style.left = `${crossPos}px`;
            }

            artboard.appendChild(line);
            artboard.appendChild(badge);
        }

        function hideSmartGuides() {
            guideX.style.display = 'none';
            guideY.style.display = 'none';
            document.querySelectorAll('.spacing-indicator').forEach(e => e.remove());
        }

        // --- Properties Inputs Handlers ---
        inputs.forEach(inp => {
            inp.addEventListener('input', (e) => {
                if (state.selectedIds.length === 0) return;
                
                const prop = e.target.dataset.prop;
                let val = e.target.value;
                
                // Parse numbers/percentages for specific fields
                if (['x', 'w'].includes(prop)) val = parseVal(val, ARTBOARD_W);
                if (['y', 'h'].includes(prop)) val = parseVal(val, ARTBOARD_H);
                if (['radius', 'rotation', 'fillOpacity', 'strokeWidth', 'shadowX', 'shadowY', 'shadowBlur', 'shadowSpread', 'fontSize'].includes(prop)) {
                    val = parseFloat(val) || 0;
                }

                // החל את השינוי על כל האלמנטים הנבחרים
                state.selectedIds.forEach(id => {
                    const el = state.elements.find(ex => ex.id === id);
                    if (el) el[prop] = val;
                });
                
                // Special syncs
                if (prop === 'shadowType') updatePropertiesPanel(); // Show/hide controls

                renderAll();
            });
            inp.addEventListener('change', () => {
                saveHistory();
            });
        });

        // פונקציית העברת שכבות על ידי קיצורי מקלדת
        function moveLayer(dir) {
            if (state.selectedIds.length !== 1) return; // תומך רק בהעברת שכבה בודדת כרגע
            const idx = state.elements.findIndex(e => e.id === state.selectedIds[0]);
            
            if (dir === 1 && idx < state.elements.length - 1) {
                // העבר קדימה
                const temp = state.elements[idx];
                state.elements[idx] = state.elements[idx + 1];
                state.elements[idx + 1] = temp;
                saveHistory();
                renderAll();
            } else if (dir === -1 && idx > 0) { 
                // העבר אחורה
                const temp = state.elements[idx];
                state.elements[idx] = state.elements[idx - 1];
                state.elements[idx - 1] = temp;
                saveHistory();
                renderAll();
            }
        }

        // --- Keyboard Shortcuts ---
        window.addEventListener('keydown', (e) => {
            // התעלמות כשהמשתמש מקליד בתוך שדה טקסט
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const cmdOrCtrl = isMac ? e.metaKey : e.ctrlKey;

            // שימוש ב-e.code כדי לעקוף בעיות של שפה (מקלדת עברית תעבוד מושלם)
            if (cmdOrCtrl) {
                switch(e.code) {
                    case 'KeyC': copySelection(); e.preventDefault(); break;
                    case 'KeyV': pasteSelection(); e.preventDefault(); break;
                    case 'KeyX': cutSelection(); e.preventDefault(); break;
                    case 'KeyD': duplicateSelection(); e.preventDefault(); break;
                    case 'BracketRight': moveLayer(1); e.preventDefault(); break; // Ctrl + ]
                    case 'BracketLeft': moveLayer(-1); e.preventDefault(); break; // Ctrl + [
                    case 'KeyZ': 
                        if (e.shiftKey) { redo(); } 
                        else { undo(); }
                        e.preventDefault(); 
                        break;
                    case 'KeyY': redo(); e.preventDefault(); break;
                }
                return;
            }

            switch(e.code) {
                case 'KeyV': setTool('V'); break;
                case 'KeyR': setTool('R'); break;
                case 'KeyO': setTool('O'); break;
                case 'KeyT': setTool('T'); break;
                case 'KeyI': setTool('I'); break;
                case 'Delete':
                case 'Backspace':
                    deleteSelected();
                    break;
            }
        });

        // --- Init ---
        const editorInput = JSON.parse(localStorage.getItem('karuai:advanced-editor-input') || 'null');
        carouselSlides = editorInput?.carousel?.slides || [];
        activeSlideIndex = Math.min(editorInput?.currentSlide || 0, Math.max(0, carouselSlides.length - 1));
        carouselSlides.forEach(slide => {
            elementsBySlide[slide.id] = createElementsFromSlide(slide, editorInput.theme);
        });
        const currentSlide = carouselSlides[activeSlideIndex];
        const savedElements = currentSlide
            ? JSON.stringify(elementsBySlide[currentSlide.id])
            : localStorage.getItem('karuai:advanced-editor-elements');
        if (savedElements) {
            try {
                state.elements = JSON.parse(savedElements);
            } catch (error) {
                console.warn('[KaruAI editor] Failed to restore saved elements.', error);
                localStorage.removeItem('karuai:advanced-editor-elements');
            }
        }
        renderSlideTabs();
        if (carouselSlides.length) {
            elementsBySlide[carouselSlides[activeSlideIndex].id] = state.elements;
        }
        if (state.elements.length === 0) {
            const bg = createElement('rect', 0, 0);
            bg.w = 1080; bg.h = 1350; bg.fillColor = '#fafafa'; bg.name = 'Background';
            
            const card = createElement('rect', 140, 200);
            card.w = 800; card.h = 950; card.radius = 40; card.fillColor = '#ffffff'; card.name = 'Card';
            card.shadowType = 'drop-shadow'; card.shadowY = 20; card.shadowBlur = 60; card.shadowColor = '#000000';
            card.shadowSpread = -10;

            const circle = createElement('ellipse', 440, 300);
            circle.w = 200; circle.h = 200; circle.fillColor = '#0d99ff'; circle.name = 'Avatar';

            const text = createElement('text', 140, 600);
            text.content = 'קרוסלה\nמקצועית';
            text.fontSize = 120; text.fontWeight = '900'; text.fillColor = '#111111'; text.textAlign = 'center'; text.w = 800; text.name = 'Title';
        }

        function createElementsFromSlide(slide, theme) {
            const elements = [];
            const positions = slide.layout || {};
            const position = (name, fallback) => ({ ...fallback, ...(positions[name] || {}) });
            const textColor = theme?.textColor || '#111111';
            const bgColor = theme?.bgColor || '#fafafa';
            const accentColor = theme?.accentColor || '#0d99ff';
            elements.push({
                id: 'slide-background', type: 'rect', name: 'Background', x: 0, y: 0, w: 1080, h: 1350,
                rotation: 0, radius: 0, fillColor: bgColor, fillOpacity: 100, strokeColor: '#000000',
                strokeWidth: 0, strokeStyle: 'solid', shadowType: 'none', shadowX: 0, shadowY: 0,
                shadowBlur: 0, shadowSpread: 0, shadowColor: '#000000', content: '', fontSize: 64,
                fontWeight: '700', textAlign: 'right', src: ''
            });
            elements.push({
                id: 'slide-title', type: 'text', name: 'Title', ...position('title', { x: 100, y: 180, w: 880, h: 'auto' }),
                rotation: 0, radius: 0, fillColor: textColor, fillOpacity: 100, strokeColor: '#000000',
                strokeWidth: 0, strokeStyle: 'solid', shadowType: 'none', shadowX: 0, shadowY: 0,
                shadowBlur: 0, shadowSpread: 0, shadowColor: '#000000', content: slide.title || '',
                fontSize: 86, fontWeight: '900', textAlign: 'right', src: ''
            });
            elements.push({
                id: 'slide-content', type: 'text', name: 'Content', ...position('content', { x: 100, y: 420, w: 880, h: 'auto' }),
                rotation: 0, radius: 0, fillColor: textColor, fillOpacity: 100, strokeColor: '#000000',
                strokeWidth: 0, strokeStyle: 'solid', shadowType: 'none', shadowX: 0, shadowY: 0,
                shadowBlur: 0, shadowSpread: 0, shadowColor: '#000000', content: slide.content || '',
                fontSize: 42, fontWeight: '400', textAlign: 'right', src: ''
            });
            if (slide.imageUrl) {
                elements.push({
                    id: 'slide-image', type: 'image', name: 'Image', ...position('image', { x: 100, y: 850, w: 880, h: 400 }),
                    rotation: 0, radius: 24, fillColor: accentColor, fillOpacity: 100, strokeColor: '#000000',
                    strokeWidth: 0, strokeStyle: 'solid', shadowType: 'none', shadowX: 0, shadowY: 0,
                    shadowBlur: 0, shadowSpread: 0, shadowColor: '#000000', content: '', fontSize: 64,
                    fontWeight: '700', textAlign: 'right', src: slide.imageUrl
                });
            }
            return elements.concat((slide.elements || []).map(element => ({
                id: element.id, type: element.type === 'rectangle' ? 'rect' : element.type === 'circle' ? 'ellipse' : element.type,
                name: element.type, x: element.position.x, y: element.position.y, w: element.position.width || 200,
                h: element.position.height || 200, rotation: element.position.rotation || 0,
                radius: element.position.borderRadius || 0, fillColor: element.backgroundColor || element.color || accentColor,
                fillOpacity: 100, strokeColor: element.position.borderColor || '#000000',
                strokeWidth: element.position.borderWidth || 0, strokeStyle: 'solid', shadowType: 'none',
                shadowX: 0, shadowY: 0, shadowBlur: 0, shadowSpread: 0, shadowColor: '#000000',
                content: element.content || '', fontSize: element.fontSize || 64, fontWeight: '700',
                textAlign: 'right', src: element.src || ''
            })));
        }

        saveHistory();
        renderAll();

    </script>
</body>
</html>
