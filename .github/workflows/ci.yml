name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # karuai.com belongs to someone else: no page may send mail or people there (business details live in shared/business.ts)
      - name: No links to karuai.com
        run: "! grep -rnI 'karuai\\.com' app components lib messages shared worker/src public"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
